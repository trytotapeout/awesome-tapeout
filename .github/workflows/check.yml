name: Check repositories

on:
  schedule:
    - cron: "17 1 * * *" # 每天 UTC 01:17（北京时间 09:17）
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.md, scripts/check.mjs, .github/workflows/check.yml]
  pull_request:
    paths: [README.md, scripts/check.mjs]

permissions:
  contents: read
  issues: write

concurrency:
  group: check-repositories
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify listed repositories
        id: check
        run: |
          set +e
          node scripts/check.mjs | tee report.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # 失败时只维护一个 issue：已有就更新内容，没有才新建；恢复正常后自动关闭
      - name: Open, update or close the tracking issue
        if: github.event_name != 'pull_request'
        env:
          STATUS: ${{ steps.check.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --label repo-check --json number -q '.[0].number')
          if [ "$STATUS" != "0" ]; then
            {
              echo "The scheduled check found listed repositories that no longer meet the inclusion rules (public, not archived, contains source code)."
              echo
              echo '```'
              grep '^FAIL' report.txt
              tail -n 1 report.txt
              echo '```'
              echo
              echo "Run: $RUN_URL"
            } > body.md
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file body.md
            else
              gh label create repo-check --color d73a4a --description "Automated repository check" --force
              gh issue create --title "Repository check: entries need attention" --label repo-check --body-file body.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "All listed repositories pass again. Run: $RUN_URL"
          fi

      - name: Fail the job when entries are broken
        if: steps.check.outputs.status != '0'
        run: exit 1
